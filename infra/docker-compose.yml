# Local development stack. Production topology is in DEPLOYMENT_GUIDE.md.
# Ports are bound to 127.0.0.1 only.
name: jarvis

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg18
    command: ["postgres", "-c", "max_connections=300"]   # Phase 5 concurrency tests open 100+ connections
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set in .env}
      POSTGRES_USER: ${DB_USERNAME:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-x} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  ai-engine:
    restart: unless-stopped
    build:
      context: ../apps/ai-engine
      dockerfile: ../../infra/docker/ai-engine.Dockerfile
    environment:
      AI_ENGINE_ENV: ${AI_ENGINE_ENV:-local}
      AI_ENGINE_HMAC_SECRET: ${AI_ENGINE_HMAC_SECRET:?set in .env}
      AI_ENGINE_JWT_SECRET: ${AI_ENGINE_JWT_SECRET:?set in .env}
      AI_ENGINE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      redis: {condition: service_healthy}
    # Laravel on the HOST (nginx + php-fpm) reaches the engine here; bound to localhost only, never public.
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
