# JARVIS ONE — self-host stack (one command: ./install.sh). Everything runs in containers.
# Only nginx (or Caddy when a domain is set) is reachable from the internet; PostgreSQL, Redis and the AI engine have NO published ports.
name: jarvis

x-web-env: &web-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?set in .env}
  APP_URL: ${APP_URL:?set in .env}
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:-jarvis}
  DB_USERNAME: jarvis_app
  DB_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
  DB_ADMIN_USERNAME: jarvis_admin_login
  DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?set in .env}
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?set in .env}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  AI_ENGINE_URL: http://ai-engine:8000
  AI_ENGINE_HMAC_SECRET: ${AI_ENGINE_HMAC_SECRET:?set in .env}
  AI_ENGINE_JWT_SECRET: ${AI_ENGINE_JWT_SECRET:?set in .env}
  AI_VAULT_CURRENT: ${AI_VAULT_CURRENT:-1}
  AI_VAULT_KEY_1: ${AI_VAULT_KEY_1:?set in .env}
  MAIL_MAILER: ${MAIL_MAILER:-log}
  JARVIS_LICENSE_PUBKEY: ${JARVIS_LICENSE_PUBKEY:-}
  JARVIS_LICENSE_FILE: /var/www/html/storage/app/selfhost/license.key

x-web: &web
  image: jarvis-web:${JARVIS_VERSION:-local}
  restart: unless-stopped
  environment: *web-env
  volumes: [appstorage:/var/www/html/storage]
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg18
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jarvis}
      POSTGRES_USER: ${DB_USERNAME:-jarvis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  ai-engine:
    restart: unless-stopped
    build:
      context: ../apps/ai-engine
      dockerfile: ../../infra/docker/ai-engine.Dockerfile
      args:
        WITH_RENDER: ${WITH_RENDER:-1}
    image: jarvis-ai-engine:${JARVIS_VERSION:-local}
    environment:
      AI_ENGINE_ENV: production
      AI_ENGINE_HMAC_SECRET: ${AI_ENGINE_HMAC_SECRET:?set in .env}
      AI_ENGINE_JWT_SECRET: ${AI_ENGINE_JWT_SECRET:?set in .env}
      AI_ENGINE_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
    # Lets a local Ollama on the Docker host be added as a provider (http://host.docker.internal:11434/v1). See local-worker/.
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot: creates the 3 login roles and the group roles (idempotent). Needs the PostgreSQL superuser.
  provision:
    image: pgvector/pgvector:pg18
    restart: "no"
    profiles: ["setup"]
    working_dir: /work
    entrypoint: ["bash", "scripts/db-provision.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-jarvis}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE:-jarvis}
      DB_DATABASE: ${DB_DATABASE:-jarvis}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?set in .env}
      DB_ADMIN_PASSWORD: ${DB_ADMIN_PASSWORD:?set in .env}
    volumes:
      - ../scripts:/work/scripts:ro
      - ../apps/web-overlay/database/sql:/work/apps/web-overlay/database/sql:ro
    depends_on:
      postgres: {condition: service_healthy}

  # One-shot: migrations run as jarvis_owner (the only role allowed to change tables), then seeds and checks isolation.
  migrate:
    <<: *web
    restart: "no"
    profiles: ["setup"]
    environment:
      <<: *web-env
      DB_USERNAME: jarvis_owner
      DB_PASSWORD: ${DB_OWNER_PASSWORD:?set in .env}
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --class=PlatformSeeder --force; php artisan roles:sync && php artisan tenancy:check; php artisan storage:link 2>/dev/null || true"]

  web:
    <<: *web
    # This is the only service that builds the app image (jarvis-web:<version>); horizon, scheduler and migrate reuse it.
    build:
      context: ..
      dockerfile: selfhost/docker/web.Dockerfile
      target: app
    command: ["php-fpm"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm"]
      interval: 15s
      timeout: 5s
      retries: 5

  horizon:
    <<: *web
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s

  scheduler:
    <<: *web
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: jarvis-nginx:${JARVIS_VERSION:-local}
    restart: unless-stopped
    build:
      context: ..
      dockerfile: selfhost/docker/web.Dockerfile
      target: nginx
    ports: ["${WEB_BIND:-0.0.0.0:80}:80"]
    depends_on: [web]

  # Automatic HTTPS (Let's Encrypt). Enabled by install.sh --domain (COMPOSE_PROFILES=https); then WEB_BIND is 127.0.0.1:8080.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [nginx]

volumes:
  pgdata:
  redisdata:
  appstorage:
  caddydata:
