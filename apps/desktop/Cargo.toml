[package]
name = "jarvis-desktop"
version = "1.0.0"
description = "JARVIS ONE desktop shell: tray icon + window around `jarvis-agent gui`"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
