[project]
name = "jarvis-ai-engine"
version = "0.1.0"
description = "JARVIS ONE AI engine (internal service, called only by Laravel)"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "redis>=5",
  "httpx>=0.28",
  "beautifulsoup4>=4.12",
  "lxml>=5",
  "phonenumbers>=8.13",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=1.0",
  "dnspython>=2.6",
  "pypdf>=5",
  "pypdfium2>=4.30",
  "pillow>=11",
  "qrcode>=8",
  "python-barcode>=0.15",
]

[project.optional-dependencies]
# JavaScript rendering for the lead crawler (needs `playwright install --with-deps chromium`). Off unless installed.
render = ["playwright>=1.45"]
dev = ["pytest>=9", "pytest-asyncio>=0.24", "httpx>=0.28", "ruff>=0.17", "mypy>=2", "types-openpyxl", "reportlab>=4", "hypothesis>=6", "psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live_model: calls a real AI model with your key; skipped unless JARVIS_LIVE_MODEL=1 (tests/live)"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]   # long lines are accepted project-wide (already waived in most folders)

[tool.ruff.lint.per-file-ignores]
"app/leads/*" = ["E501"]
"app/bills/*" = ["E501"]
"app/routes_bills.py" = ["E501"]
"app/routes_leads.py" = ["E501"]
"app/docs/*" = ["E501"]
"app/seo/*" = ["E501"]
"app/routes_seo.py" = ["E501"]
"app/routes_docs.py" = ["E501"]
"tests/*" = ["F811", "S105", "S106", "S603", "S607", "E501", "S104", "S310"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
# No type stubs published for these (playwright is an optional extra, pypdfium2 ships no py.typed).
module = ["playwright.*", "pypdfium2.*"]
ignore_missing_imports = true
