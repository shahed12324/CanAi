name: desktop-agent
# Verifies the computer agent and the Tauri desktop shell on the three real operating systems.
on:
  push:
    paths: ["apps/pc-agent/**", "apps/desktop/**", ".github/workflows/desktop-agent.yml"]
  pull_request:
    paths: ["apps/pc-agent/**", "apps/desktop/**", ".github/workflows/desktop-agent.yml"]
  workflow_dispatch:

jobs:
  agent-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest psutil
      - run: python -m pytest apps/pc-agent/tests -q
        env: { PYTHONPATH: apps/pc-agent }

  gui-browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pytest psutil
      - run: npm i --no-save puppeteer-core
      - run: node apps/pc-agent/tests/e2e/gui.e2e.cjs
        env: { CHROME: /usr/bin/google-chrome, PYTHON: python }

  desktop-shell:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: cargo test --manifest-path apps/desktop/Cargo.toml
      - run: cargo build --release --manifest-path apps/desktop/Cargo.toml
